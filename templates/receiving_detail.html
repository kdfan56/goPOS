<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{.Label}} — Receiving — goPOS</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; color: #222; }
  h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
  .sub { color: #777; font-size: 0.9rem; margin-bottom: 1rem; }
  .back { color: #47a; text-decoration: none; font-size: 0.9rem; }
  .back:hover { text-decoration: underline; }

  .scan-row { display: flex; gap: 0.5rem; align-items: center; padding: 0.75rem; background: #f4f4f4; border-radius: 6px; }
  .scan-row label { font-weight: 600; }
  .scan-row input { flex: 1; padding: 0.5rem; font-size: 1.1rem; border: 1px solid #ccc; border-radius: 4px; }

  .msg { margin: 0.5rem 0; padding: 0.5rem; border-radius: 4px; min-height: 1.5rem; }
  .msg.error { background: #ffe5e5; color: #b00; }
  .msg.success { background: #e5ffe5; color: #0a0; }

  table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
  th, td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #fafafa; font-size: 0.85rem; color: #666; }
  td.right, th.right { text-align: right; }
  td.mono { font-family: 'Courier New', monospace; color: #777; font-size: 0.9rem; }
  td.qty-cell { white-space: nowrap; }
  .empty { color: #888; font-style: italic; text-align: center; padding: 1.5rem; }

  .qty-btn, .void-btn { padding: 0.25rem 0.6rem; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; font-size: 0.9rem; }
  .qty-btn:hover { background: #f0f0f0; }
  .void-btn { color: #b00; border-color: #f5b8b8; }
  .void-btn:hover { background: #ffe5e5; }
  .qty { display: inline-block; min-width: 2.5rem; text-align: center; font-weight: 600; }

  .totals { padding: 1rem; background: #f4f4f4; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
  .totals .grand { font-size: 1.6rem; font-weight: 700; }

  .footer-actions { margin-top: 1.5rem; display: flex; justify-content: flex-end; }
  .delete-btn { padding: 0.55rem 1rem; background: #fff; color: #b00; border: 1px solid #f5b8b8; border-radius: 4px; font-weight: 600; cursor: pointer; }
  .delete-btn:hover { background: #ffe5e5; }
</style>
</head>
<body>
<a href="/receiving" class="back">&larr; All sessions</a>
<h1>{{.Label}}</h1>
<div class="sub">Started {{.StartedAt}} · session #{{.ID}}</div>

<div class="scan-row">
  <label for="barcode">Scan:</label>
  <input id="barcode" type="text" autocomplete="off" autofocus placeholder="Scan barcode and press Enter">
</div>

<div id="msg" class="msg"></div>

<table>
  <thead>
    <tr>
      <th>Item</th>
      <th>Barcode</th>
      <th class="right">In stock</th>
      <th>Receiving qty</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="items-body"></tbody>
</table>

<div class="totals">
  <div>Distinct items: <span id="item-count">0</span></div>
  <div class="grand">Total qty: <span id="total-qty">0</span></div>
</div>

<div class="footer-actions">
  <form method="POST" action="/receiving/{{.ID}}/delete"
        onsubmit="return confirm('Delete this whole session? Nothing has been added to stock yet — this just discards the scans.');">
    <button type="submit" class="delete-btn">Delete session</button>
  </form>
</div>

<script>
const sessionId = {{.ID}};
let items = {{.ItemsJSON}};

const barcodeInput = document.getElementById('barcode');
const msg = document.getElementById('msg');
const itemsBody = document.getElementById('items-body');
const itemCount = document.getElementById('item-count');
const totalQty = document.getElementById('total-qty');

let msgTimer = 0;
function showMessage(text, type) {
  msg.textContent = text;
  msg.className = 'msg ' + (type || '');
  clearTimeout(msgTimer);
  if (text) msgTimer = setTimeout(() => { msg.textContent = ''; msg.className = 'msg'; }, 3000);
}

function focusBarcode() {
  barcodeInput.value = '';
  barcodeInput.focus();
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function render() {
  if (items.length === 0) {
    itemsBody.innerHTML = '<tr><td colspan="5" class="empty">Nothing scanned yet. Scan an item.</td></tr>';
  } else {
    itemsBody.innerHTML = items.map(it =>
      '<tr>'
      + '<td>' + escapeHtml(it.name) + '</td>'
      + '<td class="mono">' + escapeHtml(it.barcode) + '</td>'
      + '<td class="right">' + it.stock + '</td>'
      + '<td class="qty-cell">'
        + '<button class="qty-btn" data-op="dec" data-id="' + it.product_id + '">&minus;</button> '
        + '<span class="qty">' + it.qty + '</span> '
        + '<button class="qty-btn" data-op="inc" data-id="' + it.product_id + '">+</button>'
      + '</td>'
      + '<td><button class="void-btn" data-op="remove" data-id="' + it.product_id + '">&times;</button></td>'
      + '</tr>'
    ).join('');
  }
  let total = 0;
  items.forEach(it => total += it.qty);
  itemCount.textContent = items.length;
  totalQty.textContent = total;
}

async function scan(barcode) {
  try {
    const res = await fetch('/receiving/' + sessionId + '/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ barcode }),
    });
    if (res.status === 404) { showMessage('Barcode ' + barcode + ' not in system', 'error'); return; }
    if (res.status === 409) { showMessage('This session is already finalized', 'error'); return; }
    if (!res.ok) { showMessage('Scan failed (' + res.status + ')', 'error'); return; }
    const data = await res.json();
    items = data.items;
    render();
    showMessage('Added: ' + data.scanned, 'success');
  } catch (e) {
    showMessage('Network error', 'error');
  }
}

async function adjustItem(productId, op) {
  try {
    const res = await fetch('/receiving/' + sessionId + '/item', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product_id: productId, op }),
    });
    if (!res.ok) { showMessage('Update failed (' + res.status + ')', 'error'); return; }
    const data = await res.json();
    items = data.items;
    render();
  } catch (e) {
    showMessage('Network error', 'error');
  }
}

barcodeInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const v = barcodeInput.value.trim();
    if (v) scan(v);
    focusBarcode();
  }
});

// Event delegation: rows are rebuilt by render(), so listen on the table body.
itemsBody.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-op]');
  if (!btn) return;
  adjustItem(parseInt(btn.dataset.id, 10), btn.dataset.op);
  focusBarcode();
});

render();
focusBarcode();
</script>
</body>
</html>
