<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>POS — goPOS</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 1rem auto; padding: 0 1rem; color: #222; }
  h1 { margin: 0 0 1rem; font-size: 1.5rem; }

  .scan-row { display: flex; gap: 0.5rem; align-items: center; padding: 0.75rem; background: #f4f4f4; border-radius: 6px; }
  .scan-row label { font-weight: 600; }
  .scan-row input { flex: 1; padding: 0.5rem; font-size: 1.1rem; border: 1px solid #ccc; border-radius: 4px; }

  .msg { margin: 0.5rem 0; padding: 0.5rem; border-radius: 4px; min-height: 1.5rem; }
  .msg.error { background: #ffe5e5; color: #b00; }
  .msg.success { background: #e5ffe5; color: #0a0; }

  table.cart { width: 100%; border-collapse: collapse; margin: 1rem 0; }
  table.cart th, table.cart td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid #eee; }
  table.cart th { background: #fafafa; font-size: 0.85rem; color: #666; }
  table.cart td.right { text-align: right; }
  table.cart td.actions { text-align: center; }

  .qty-btn, .void-btn { padding: 0.25rem 0.6rem; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; font-size: 0.9rem; }
  .qty-btn:hover { background: #f0f0f0; }
  .void-btn { color: #b00; border-color: #f5b8b8; }
  .void-btn:hover { background: #ffe5e5; }
  .qty { display: inline-block; min-width: 2rem; text-align: center; font-weight: 600; }

  .totals { padding: 1rem; background: #f4f4f4; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
  .totals .summary { font-size: 1.2rem; }
  .totals .grand { font-size: 1.8rem; font-weight: 700; color: #000; }

  .pay-row { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .pay-btn { flex: 1; padding: 1rem; font-size: 1.1rem; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; color: white; }
  .pay-btn.cash { background: #4a7; }
  .pay-btn.card { background: #47a; }
  .pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .empty-cart { color: #888; text-align: center; padding: 2rem; font-style: italic; }
</style>
</head>
<body>
<h1>goPOS — Sale</h1>

<div class="scan-row">
  <label for="barcode">Scan:</label>
  <input id="barcode" type="text" autocomplete="off" autofocus placeholder="Scan barcode and press Enter">
</div>

<div id="msg" class="msg"></div>

<div id="cart-container"></div>

<div class="totals">
  <div class="summary">Items: <span id="item-count">0</span></div>
  <div class="grand">Rs. <span id="grand-total">0</span></div>
</div>

<div class="pay-row">
  <button class="pay-btn cash" id="pay-cash" disabled>Cash</button>
  <button class="pay-btn card" id="pay-card" disabled>Card</button>
</div>

<script>
const cart = [];
const barcodeInput = document.getElementById('barcode');
const msg = document.getElementById('msg');
const cartContainer = document.getElementById('cart-container');
const itemCount = document.getElementById('item-count');
const grandTotal = document.getElementById('grand-total');
const payCash = document.getElementById('pay-cash');
const payCard = document.getElementById('pay-card');

let msgTimer = 0;
function showMessage(text, type) {
  msg.textContent = text;
  msg.className = 'msg ' + (type || '');
  clearTimeout(msgTimer);
  if (text) msgTimer = setTimeout(() => { msg.textContent = ''; msg.className = 'msg'; }, 3000);
}

function focusBarcode() {
  barcodeInput.value = '';
  barcodeInput.focus();
}

// Cart UI is rebuilt from the cart array on every change. Single source of truth.
function render() {
  if (cart.length === 0) {
    cartContainer.innerHTML = '<div class="empty-cart">Cart empty. Scan an item.</div>';
  } else {
    let html = '<table class="cart"><thead><tr><th>Item</th><th class="right">Unit (Rs.)</th><th>Qty</th><th class="right">Line (Rs.)</th><th class="actions"></th></tr></thead><tbody>';
    cart.forEach((line, i) => {
      const lineTotal = line.price * line.qty;
      html += '<tr>'
        + '<td>' + escapeHtml(line.name) + '</td>'
        + '<td class="right">' + line.price + '</td>'
        + '<td><button class="qty-btn" data-action="dec" data-index="' + i + '">−</button> '
          + '<span class="qty">' + line.qty + '</span> '
          + '<button class="qty-btn" data-action="inc" data-index="' + i + '">+</button></td>'
        + '<td class="right">' + lineTotal + '</td>'
        + '<td class="actions"><button class="void-btn" data-action="void" data-index="' + i + '">×</button></td>'
        + '</tr>';
    });
    html += '</tbody></table>';
    cartContainer.innerHTML = html;
  }

  let total = 0, count = 0;
  cart.forEach(line => { total += line.price * line.qty; count += line.qty; });
  itemCount.textContent = count;
  grandTotal.textContent = total;

  const hasItems = cart.length > 0;
  payCash.disabled = !hasItems;
  payCard.disabled = !hasItems;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function adjust(index, delta) {
  cart[index].qty += delta;
  if (cart[index].qty <= 0) cart.splice(index, 1);
  render();
}

function voidLine(index) {
  cart.splice(index, 1);
  render();
}

async function scan(barcode) {
  try {
    const res = await fetch('/pos/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ barcode }),
    });
    if (res.status === 404) { showMessage('Barcode ' + barcode + ' not found', 'error'); return; }
    if (!res.ok) { showMessage('Scan failed (' + res.status + ')', 'error'); return; }
    const p = await res.json();
    const existing = cart.find(line => line.id === p.id);
    if (existing) {
      existing.qty++;
    } else {
      cart.push({ id: p.id, barcode: p.barcode, name: p.name, price: p.price_rupees, qty: 1 });
    }
    showMessage('Added: ' + p.name, 'success');
    render();
  } catch (e) {
    showMessage('Network error', 'error');
  }
}

barcodeInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const v = barcodeInput.value.trim();
    if (v) scan(v);
    focusBarcode();
  }
});

// Event delegation: cart buttons are rebuilt by render(), so we listen on the container.
cartContainer.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const i = parseInt(btn.dataset.index, 10);
  const action = btn.dataset.action;
  if (action === 'inc') adjust(i, 1);
  else if (action === 'dec') adjust(i, -1);
  else if (action === 'void') voidLine(i);
  focusBarcode();
});

// Refocus the barcode input whenever the user clicks dead space, so the scanner never misses a beep.
document.addEventListener('click', (e) => {
  if (!e.target.closest('button, input')) barcodeInput.focus();
});

async function checkout(method) {
  if (cart.length === 0) return;
  payCash.disabled = true;
  payCard.disabled = true;
  try {
    const res = await fetch('/pos/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        payment_method: method,
        items: cart.map(line => ({ product_id: line.id, quantity: line.qty })),
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: 'checkout failed' }));
      showMessage(err.error || 'Checkout failed', 'error');
      render(); // re-enables buttons if cart still has items
      return;
    }
    const data = await res.json();
    window.open('/receipt/' + data.transaction_id, '_blank');
    cart.length = 0;
    render();
    showMessage('Sale #' + data.transaction_id + ' complete', 'success');
    focusBarcode();
  } catch (e) {
    showMessage('Network error', 'error');
    render();
  }
}

payCash.addEventListener('click', () => checkout('cash'));
payCard.addEventListener('click', () => checkout('card'));

render();
focusBarcode();
</script>
</body>
</html>
